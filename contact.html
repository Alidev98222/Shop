<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تماس با ما | مدینو</title>
<meta name="description" content="راه‌های ارتباط با پشتیبانی فروشگاه اینترنتی مدینو و فرم ارسال پیام.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b4ee6'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>M</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/responsive.css">
</head>
<body data-page="contact">
<header id="site-header"></header>

<main class="container section">
  <nav class="breadcrumb"><a href="./index.html">خانه</a><span>/</span><span>تماس با ما</span></nav>
  <h1 class="page-title">تماس با ما</h1>
  <p class="page-sub">هر سوالی دارید بپرسید؛ تیم پشتیبانی ۷ روز هفته پاسخگوی شماست.</p>

  <div class="contact-grid">
    <form class="card form-card" id="contact-form" novalidate>
      <div class="form-grid">
        <div class="form-group">
          <label for="cf-name">نام و نام‌خانوادگی</label>
          <input type="text" id="cf-name" class="input" placeholder="مثلاً علی رضایی">
          <span class="error-msg"></span>
        </div>
        <div class="form-group">
          <label for="cf-email">ایمیل</label>
          <input type="email" id="cf-email" class="input" placeholder="example@mail.com">
          <span class="error-msg"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="cf-subject">موضوع</label>
        <input type="text" id="cf-subject" class="input" placeholder="موضوع پیام">
        <span class="error-msg"></span>
      </div>
      <div class="form-group">
        <label for="cf-message">متن پیام</label>
        <textarea id="cf-message" class="input" rows="5" placeholder="پیام خود را بنویسید..."></textarea>
        <span class="error-msg"></span>
      </div>
      <button type="submit" class="btn btn-primary btn-block">ارسال پیام</button>
    </form>

    <aside class="contact-info">
      <div class="info-card"><div class="info-icon">📍</div><div><h4>آدرس</h4><p>تهران، خیابان ولیعصر، برج مدرن مدینو، طبقه ۷</p></div></div>
      <div class="info-card"><div class="info-icon">📞</div><div><h4>تلفن پشتیبانی</h4><p dir="ltr">۰۲۱ - ۹۱۰۰۰۰۰۰</p></div></div>
      <div class="info-card"><div class="info-icon">✉️</div><div><h4>ایمیل</h4><p dir="ltr">support@madino.example</p></div></div>
      <div class="info-card"><div class="info-icon">🕒</div><div><h4>ساعات پاسخگویی</h4><p>شنبه تا پنجشنبه، ۹ صبح تا ۹ شب</p></div></div>
      <div class="map-box"><span>🗺️ موقعیت دفتر مرکزی مدینو</span></div>
    </aside>
  </div>
</main>

<footer id="site-footer"></footer>
<script src="./js/data/products.js"></script>
<script src="./js/main.js"></script>
<script src="./js/cart.js"></script>
<script src="./js/pages.js"></script>
</body>
</html>
